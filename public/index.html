
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARK CREATOR STUDIO</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090909;
      color: #f5f1e8;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 24px 18px;
      text-align: center;
      border-bottom: 1px solid #453619;
      background: #101010;
    }

    header h1 {
      color: #d9b35b;
      font-size: 24px;
      margin: 0 0 10px;
      letter-spacing: 1px;
    }

    header p {
      color: #aaa;
      font-size: 13px;
      margin: 0;
    }

    main {
      width: min(720px, 100%);
      margin: auto;
      padding: 22px 16px 40px;
    }

    .panel {
      background: #121212;
      border: 1px solid #35302a;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #777;
      flex-shrink: 0;
    }

    .dot.ok { background: #45d483; }
    .dot.bad { background: #ff5656; }

    label {
      display: block;
      color: #d9b35b;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      color: #fff;
      background: #090909;
      border: 1px solid #494239;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      margin-top: 20px;
      background: linear-gradient(110deg, #a77b2c, #f0d48b);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #message {
      color: #d9b35b;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-top: 14px;
    }

    #output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.8;
      font-size: 14px;
      color: #eee;
    }

    .secondary {
      background: #242019;
      color: #f0d48b;
      border: 1px solid #68532b;
      margin-top: 12px;
    }

    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
      .panel { padding: 15px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>ARK CREATOR STUDIO</h1>
    <p>AI VIDEO SCRIPT GENERATOR</p>
  </header>

  <main>
    <section class="panel">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">API ချိတ်ဆက်မှု စစ်ဆေးနေသည်...</span>
      </div>
      <button class="secondary" id="checkButton" type="button">
        Check API Connection
      </button>
    </section>

    <section class="panel">
      <h2 style="color:#d9b35b;margin-top:0">
        Generate Your Script
      </h2>

      <form id="scriptForm">
        <label for="topic">ဇာတ်လမ်းခေါင်းစဉ်</label>
        <textarea
          id="topic"
          placeholder="ဥပမာ - မြန်မာရွာက သရဲခြောက်တဲ့အိမ်"
          required
        ></textarea>

        <div class="grid">
          <div>
            <label for="contentType">Content Type</label>
            <select id="contentType">
              <option>AI Video</option>
              <option>Horror Story</option>
              <option>2D Cartoon</option>
              <option>Advertisement</option>
              <option>TikTok Story</option>
            </select>
          </div>

          <div>
            <label for="duration">ကြာချိန်</label>
            <select id="duration">
              <option>30 seconds</option>
              <option selected>60 seconds</option>
              <option>3 minutes</option>
              <option>5 minutes</option>
            </select>
          </div>

          <div>
            <label for="language">ဘာသာစကား</label>
            <select id="language">
              <option value="Myanmar">မြန်မာ</option>
              <option value="English">English</option>
              <option value="Japanese">Japanese</option>
            </select>
          </div>

          <div>
            <label for="style">Visual Style</label>
            <select id="style">
              <option>Cinematic</option>
              <option>Photorealistic</option>
              <option>2D Cartoon</option>
              <option>3D Animation</option>
              <option>Dark Luxury</option>
            </select>
          </div>
        </div>

        <button id="generateButton" type="submit">
          ✦ Generate AI Script
        </button>

        <div id="message" role="status"></div>
      </form>
    </section>

    <section class="panel">
      <h3 style="color:#d9b35b;margin-top:0">Generated Result</h3>
      <div id="output">သင့်ရဲ့ AI Script ကို ဒီနေရာမှာ ပြပေးပါမယ်။</div>
      <button class="secondary" id="copyButton" type="button">
        Copy Script
      </button>
    </section>
  </main>

  <script>
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const message = document.getElementById("message");
    const output = document.getElementById("output");
    const form = document.getElementById("scriptForm");
    const generateButton = document.getElementById("generateButton");

    async function checkAPI() {
      statusDot.className = "dot";
      statusText.textContent = "API စစ်ဆေးနေသည်...";

      try {
        const response = await fetch("/api/health");
        const data = await response.json();

        if (response.ok && data.ok === true) {
          statusDot.className = "dot ok";
          statusText.textContent = "API Connected";
          return true;
        }

        throw new Error(data.error || "Health check failed");
      } catch (error) {
        statusDot.className = "dot bad";
        statusText.textContent = "API Not Connected";
        message.textContent =
          "API ချိတ်ဆက်မှု မအောင်မြင်ပါ။ Worker URL နဲ့ Deployment ကို စစ်ပါ။";
        return false;
      }
    }

    document.getElementById("checkButton").addEventListener(
      "click",
      checkAPI
    );

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const topic = document.getElementById("topic").value.trim();

      if (!topic) {
        message.textContent = "ဇာတ်လမ်းခေါင်းစဉ် ထည့်ပေးပါ။";
        return;
      }

      generateButton.disabled = true;
      generateButton.textContent = "Generating...";
      message.textContent = "Groq AI က Script ရေးပေးနေပါတယ်...";
      output.textContent = "";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            topic,
            contentType:
              document.getElementById("contentType").value,
            duration:
              document.getElementById("duration").value,
            language:
              document.getElementById("language").value,
            style:
              document.getElementById("style").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Script generation failed");
        }

        output.textContent = data.script;
        message.textContent = "Script အောင်မြင်စွာ ထုတ်ပြီးပါပြီ။";
      } catch (error) {
        message.textContent = "Error: " + error.message;
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = "✦ Generate AI Script";
      }
    });

    document.getElementById("copyButton").addEventListener(
      "click",
      async function() {
        const text = output.textContent;

        try {
          await navigator.clipboard.writeText(text);
          message.textContent = "Script ကို Copy လုပ်ပြီးပါပြီ။";
        } catch {
          message.textContent =
            "Copy မရပါ။ Script ကို ဖိထားပြီး Copy လုပ်ပါ။";
        }
      }
    );

    checkAPI();
  </script>
</body>
</html>
