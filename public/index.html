
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>ARK CREATOR STUDIO</title>

  <style>
    :root {
      --bg: #090909;
      --panel: #131313;
      --gold: #e0b95f;
      --gold-light: #f8dfa0;
      --text: #f5f1e8;
      --muted: #aaa;
      --border: #383126;
      --green: #45d483;
      --red: #ff6666;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #211a0d 0%, #090909 48%);
      color: var(--text);
      font-family: Arial, "Noto Sans Myanmar", sans-serif;
    }

    header {
      text-align: center;
      padding: 28px 16px 24px;
      background: rgba(12, 12, 12, 0.95);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--gold);
      font-size: clamp(23px, 5vw, 34px);
      font-weight: 900;
      letter-spacing: 2px;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 10px;
    }

    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 22px 15px 45px;
    }

    .panel {
      background: rgba(19, 19, 19, 0.97);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
    }

    h2, h3 {
      color: var(--gold);
      margin-top: 0;
    }

    h2 {
      font-size: 20px;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      background: #777;
      border-radius: 50%;
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 10px rgba(69, 212, 131, 0.45);
    }

    .status-dot.offline {
      background: var(--red);
    }

    label {
      display: block;
      color: var(--gold-light);
      font-size: 14px;
      margin: 17px 0 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #494238;
      border-radius: 9px;
      background: #0b0b0b;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.7;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .mode-card {
      display: block;
      position: relative;
      padding: 15px;
      margin: 0;
      border: 1px solid #494238;
      border-radius: 12px;
      background: #0c0c0c;
      cursor: pointer;
    }

    .mode-card:has(input:checked) {
      border-color: var(--gold);
      background: #211b10;
    }

    .mode-card input {
      width: auto;
      margin: 0 7px 0 0;
      accent-color: var(--gold);
    }

    .mode-title {
      color: var(--gold-light);
      font-size: 14px;
      font-weight: bold;
      line-height: 1.7;
    }

    .mode-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      margin-top: 8px;
      font-weight: normal;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(110deg, #a77b2c, #f8dfa0);
      color: #111;
      transition: opacity 0.2s;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .secondary {
      background: #211c12;
      border: 1px solid #66522c;
      color: var(--gold-light);
    }

    #message {
      font-size: 13px;
      line-height: 1.8;
      margin-top: 14px;
      color: var(--gold-light);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #output {
      min-height: 100px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.9;
      color: #eee;
    }

    .empty {
      color: #777;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 11px;
      padding: 12px;
    }

    @media (max-width: 480px) {
      .panel {
        padding: 16px;
      }

      .mode-grid {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1 class="brand">ARK CREATOR STUDIO</h1>
    <div class="subtitle">AI VIDEO SCRIPT GENERATOR</div>
  </header>

  <main>
    <!-- API CONNECTION -->
    <section class="panel">
      <h3>API Connection</h3>

      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking API connection...</span>
      </div>

      <button class="secondary" id="checkButton" type="button">
        Check API Connection
      </button>
    </section>

    <!-- SCRIPT FORM -->
    <section class="panel">
      <h2>Create Your AI Story</h2>

      <p class="description">
        ရုပ်ရှင်၊ ကာတွန်း၊ Horror၊ TikTok နဲ့ အခြား Video ဇာတ်ညွှန်းများ ဖန်တီးပါ။
      </p>

      <form id="scriptForm">
        <label for="topic">Story Topic / ဇာတ်လမ်းခေါင်းစဉ်</label>

        <textarea
          id="topic"
          name="topic"
          placeholder="ဥပမာ - ညသန်းခေါင်မှာ သရဲခြောက်တဲ့ မြန်မာရွာတစ်ရွာ..."
          required
        ></textarea>

        <!-- TWO SCRIPT MODES -->
        <label>Script Mode / ဇာတ်ညွှန်းပုံစံ</label>

        <div class="mode-grid">
          <label class="mode-card">
            <div class="mode-title">
              <input
                type="radio"
                name="scriptMode"
                value="narrator"
                checked
              >
              Narrator Mode
            </div>

            <div class="mode-desc">
              ဇာတ်ကြောင်းပြောသူတစ်ယောက်က ဇာတ်လမ်းကို မြန်မာလို ပြောပြမယ်။
              ဇာတ်ကောင်တွေက စကားမပြောဘဲ လှုပ်ရှားမှုနဲ့ အမူအရာကိုသာ ပြမယ်။
            </div>
          </label>

          <label class="mode-card">
            <div class="mode-title">
              <input
                type="radio"
                name="scriptMode"
                value="character"
              >
              Character Dialogue Mode
            </div>

            <div class="mode-desc">
              ဇာတ်ကောင်တွေ ကိုယ်တိုင် မြန်မာလို အပြန်အလှန် စကားပြောမယ်။
              ဘယ်ဇာတ်ကောင်က ဘာပြောတယ်ဆိုတာ သီးခြားဖော်ပြမယ်။
            </div>
          </label>
        </div>

        <div class="grid">
          <div>
            <label for="contentType">Content Type</label>
            <select id="contentType" name="contentType">
              <option value="AI Video">AI Video</option>
              <option value="Horror Story">Horror Story</option>
              <option value="2D Cartoon">2D Cartoon</option>
              <option value="3D Animation">3D Animation</option>
              <option value="Advertisement">Advertisement</option>
              <option value="TikTok Story">TikTok Story</option>
              <option value="Short Film">Short Film</option>
            </select>
          </div>

          <div>
            <label for="duration">Video Duration</label>
            <select id="duration" name="duration">
              <option value="30 seconds">30 Seconds</option>
              <option value="60 seconds" selected>1 Minute</option>
              <option value="2 minutes">2 Minutes</option>
              <option value="3 minutes">3 Minutes</option>
              <option value="5 minutes">5 Minutes</option>
              <option value="10 minutes">10 Minutes</option>
            </select>
          </div>

          <div>
            <label for="language">Script Language</label>
            <select id="language" name="language">
              <option value="Myanmar" selected>မြန်မာဘာသာ</option>
              <option value="English">English</option>
              <option value="Japanese">Japanese</option>
            </select>
          </div>

          <div>
            <label for="style">Visual Style</label>
            <select id="style" name="style">
              <option value="Cinematic">Cinematic</option>
              <option value="Photorealistic">Photorealistic</option>
              <option value="2D Cartoon">2D Cartoon</option>
              <option value="3D Animation">3D Animation</option>
              <option value="Dark Luxury">Dark Luxury</option>
              <option value="Traditional Myanmar">Traditional Myanmar</option>
            </select>
          </div>
        </div>

        <button id="generateButton" type="submit">
          ✦ Generate AI Script
        </button>

        <div id="message" role="status" aria-live="polite"></div>
      </form>
    </section>

    <!-- RESULT -->
    <section class="panel">
      <h3>Generated Script</h3>

      <div id="output" class="empty">
        Your generated script will appear here.
      </div>

      <button class="secondary" id="copyButton" type="button">
        Copy Script
      </button>
    </section>

    <div class="footer">
      ARK CREATOR STUDIO
    </div>
  </main>

  <script>
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const message = document.getElementById("message");
    const output = document.getElementById("output");
    const form = document.getElementById("scriptForm");
    const generateButton = document.getElementById("generateButton");

    // Check the API running on the same origin
    async function checkAPI() {
      statusDot.className = "status-dot";
      statusText.textContent = "Checking API connection...";

      try {
        const response = await fetch("/api/health", {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        if (!response.ok || data.ok !== true) {
          throw new Error(data.error || "Health check failed");
        }

        statusDot.className = "status-dot online";
        statusText.textContent = "Worker API Connected";
        message.textContent = "";

        return true;
      } catch (error) {
        statusDot.className = "status-dot offline";
        statusText.textContent = "API Connection Failed";

        message.textContent =
          "API connection မရပါ။ Website ကို Worker URL မှာဖွင့်ထားကြောင်း စစ်ပါ။";

        return false;
      }
    }

    document
      .getElementById("checkButton")
      .addEventListener("click", checkAPI);

    // Submit script generation request to the Worker
    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const topic = document.getElementById("topic").value.trim();

      const selectedMode = document.querySelector(
        'input[name="scriptMode"]:checked'
      );

      if (!topic) {
        message.textContent = "ဇာတ်လမ်းခေါင်းစဉ် ထည့်ပေးပါ။";
        return;
      }

      const scriptMode = selectedMode
        ? selectedMode.value
        : "narrator";

      const requestBody = {
        topic: topic,
        contentType: document.getElementById("contentType").value,
        duration: document.getElementById("duration").value,
        language: document.getElementById("language").value,
        style: document.getElementById("style").value,
        scriptMode: scriptMode
      };

      generateButton.disabled = true;
      generateButton.textContent = "Generating...";
      message.textContent = "AI က ဇာတ်ညွှန်း ဖန်တီးနေပါတယ်...";
      output.textContent = "";
      output.className = "";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (!response.ok || data.ok !== true) {
          throw new Error(
            data.error || `Request failed: ${response.status}`
          );
        }

        if (typeof data.script !== "string" || !data.script.trim()) {
          throw new Error("AI က ဇာတ်ညွှန်းပြန်မပေးပါ။");
        }

        output.textContent = data.script;
        message.textContent =
          scriptMode === "narrator"
            ? "Narrator Mode ဖြင့် ဇာတ်ညွှန်း ထုတ်ပြီးပါပြီ။"
            : "Character Dialogue Mode ဖြင့် ဇာတ်ညွှန်း ထုတ်ပြီးပါပြီ။";

      } catch (error) {
        output.textContent = "Script generation failed.";
        output.className = "empty";
        message.textContent = "Error: " + error.message;

      } finally {
        generateButton.disabled = false;
        generateButton.textContent = "✦ Generate AI Script";
      }
    });

    // Copy generated script
    document
      .getElementById("copyButton")
      .addEventListener("click", async function() {
        const script = output.textContent;

        if (!script || output.classList.contains("empty")) {
          message.textContent = "Copy လုပ်ရန် Script မရှိသေးပါ။";
          return;
        }

        try {
          await navigator.clipboard.writeText(script);
          message.textContent = "Script ကို Copy လုပ်ပြီးပါပြီ။";
        } catch (error) {
          message.textContent =
            "Copy မရပါ။ Script စာသားကို ဖိထားပြီး Copy လုပ်ပါ။";
        }
      });

    // Initial API check
    checkAPI();
  </script>
</body>
</html>
